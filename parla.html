<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Parla — Voice to text. Local. Instant.</title>
        <link rel="icon" href="assets/litterabbit_logo.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="styles/parla.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div class="ambient" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <header class="top-bar">
            <a href="index.html" class="icon-btn" aria-label="Back to LitteRabbit">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <a href="https://github.com/LitteRabbit-37/Parla" target="_blank" rel="noreferrer noopener" class="github-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.373 0 0 5.373 0 12c0 5.303 3.438 9.8 8.207 11.387.6.111.82-.26.82-.577 0-.285-.01-1.04-.016-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.333-1.754-1.333-1.754-1.088-.745.083-.73.083-.73 1.205.085 1.838 1.237 1.838 1.237 1.07 1.833 2.809 1.304 3.495.997.108-.776.418-1.305.76-1.605-2.665-.305-5.466-1.333-5.466-5.93 0-1.31.467-2.38 1.236-3.22-.124-.303-.536-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.957-.267 1.983-.4 3.003-.405 1.02.005 2.047.138 3.006.405 2.29-1.552 3.296-1.23 3.296-1.23.655 1.653.243 2.873.12 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.624-5.48 5.92.43.372.814 1.103.814 2.222 0 1.606-.015 2.9-.015 3.294 0 .32.216.694.826.576C20.565 21.796 24 17.3 24 12 24 5.373 18.627 0 12 0z"/>
                </svg>
                <span>GitHub</span>
                <svg class="arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
            </a>
        </header>

        <main class="stage">
            <div class="pill" role="img" aria-label="Parla mini recorder">
                <button class="pill-btn" aria-label="Prompt enhancement" tabindex="-1">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
                        <path d="M20 3v4"/>
                        <path d="M22 5h-4"/>
                        <path d="M4 17v2"/>
                        <path d="M5 18H3"/>
                    </svg>
                </button>

                <div class="pill-wave" aria-hidden="true">
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                </div>

                <button class="pill-btn" aria-label="Power Mode" tabindex="-1">
                    <span class="power-dot"></span>
                </button>
            </div>

            <h1 class="wordmark">Parla</h1>
            <p class="tagline">Voice to text. Local. Instant.</p>
        </main>

        <footer class="footer-meta">
            <span>Open source</span>
            <span class="dot">·</span>
            <span>GPL-3.0</span>
            <span class="dot">·</span>
            <span>Windows 10+</span>
        </footer>

        <script src="js/parla-pill.js"></script>
    </body>
</html>
